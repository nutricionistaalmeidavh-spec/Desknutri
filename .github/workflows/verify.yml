name: NutriDesk Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r license_server/requirements.txt
          python -m pip install httpx2
      - name: Compile
        run: python -m compileall -q app.py nutridesktop tests
      - name: Test
        run: python -m pytest -q
      - name: PySide6 runtime smoke
        shell: pwsh
        run: |
          $env:NUTRIDESKTOP_DATA_DIR = Join-Path $env:RUNNER_TEMP 'nutridesk-ui-smoke'
          @'
          from nutridesktop.data.database import db
          db.initialize()
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          from nutridesktop.ui.application_window import MainWindow
          window = MainWindow()
          for page in ('Dashboard', 'Pacientes', 'Agenda', 'Biblioteca', 'Configurações'):
              window.show_page(page)
          print('UI_SMOKE_OK')
          window.close()
          '@ | python -
