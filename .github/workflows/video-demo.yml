name: NutriDesk real Chromium demo

on:
  push:
    branches:
      - video-demo-20260907
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: "vnc:size=1440x900:port=5900"
      PYTHONPATH: ${{ github.workspace }}
      NUTRIDESKTOP_DATA_DIR: ${{ github.workspace }}/.video-demo-data

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and recording dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y novnc websockify ffmpeg netcat-openbsd
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start real NutriDesk on Qt VNC
        run: |
          mkdir -p /tmp/pwvideo artifacts
          python tools/video_demo_chromium.py >/tmp/nutridesk-demo.log 2>&1 &
          echo $! > /tmp/nutridesk-demo.pid
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 5900; then break; fi
            sleep 1
          done
          echo '=== NutriDesk startup log ==='
          cat /tmp/nutridesk-demo.log || true
          PID=$(cat /tmp/nutridesk-demo.pid)
          if ! kill -0 "$PID" 2>/dev/null; then
            echo 'NutriDesk process exited before recording.'
            exit 1
          fi
          if ! nc -z 127.0.0.1 5900; then
            echo 'Qt VNC port 5900 did not open.'
            exit 1
          fi
          websockify --web=/usr/share/novnc 6080 localhost:5900 >/tmp/websockify.log 2>&1 &
          echo $! > /tmp/websockify.pid
          sleep 2
          if ! nc -z 127.0.0.1 6080; then
            echo 'noVNC websocket port 6080 did not open.'
            exit 1
          fi

      - name: Record the real UI through Chromium
        run: |
          cat > /tmp/record.py <<'PY'
          import asyncio
          from pathlib import Path
          from playwright.async_api import async_playwright

          async def main():
              out = Path('/tmp/pwvideo')
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=['--no-sandbox'])
                  context = await browser.new_context(
                      viewport={"width": 1440, "height": 900},
                      record_video_dir=str(out),
                      record_video_size={"width": 1440, "height": 900},
                  )
                  page = await context.new_page()
                  await page.goto(
                      'http://127.0.0.1:6080/vnc_lite.html?autoconnect=true&resize=scale&view_only=true',
                      wait_until='domcontentloaded',
                      timeout=30000,
                  )
                  await page.wait_for_timeout(2500)
                  await page.screenshot(path='artifacts/nutridesk_chromium_start.png')
                  await page.wait_for_timeout(50000)
                  await page.screenshot(path='artifacts/nutridesk_chromium_last_frame.png')
                  video = page.video
                  await context.close()
                  await browser.close()
                  print(await video.path())

          asyncio.run(main())
          PY
          python /tmp/record.py | tee /tmp/video-path.txt
          WEBM=$(tail -n 1 /tmp/video-path.txt)
          ffmpeg -y -i "$WEBM" -ss 2.0 -t 50 -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -movflags +faststart -an artifacts/NutriDesk_Real_Chromium_50s.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 artifacts/NutriDesk_Real_Chromium_50s.mp4
          ffmpeg -y -ss 5 -i artifacts/NutriDesk_Real_Chromium_50s.mp4 -frames:v 1 artifacts/frame_05s.png >/dev/null 2>&1
          ffmpeg -y -ss 20 -i artifacts/NutriDesk_Real_Chromium_50s.mp4 -frames:v 1 artifacts/frame_20s.png >/dev/null 2>&1
          ffmpeg -y -ss 35 -i artifacts/NutriDesk_Real_Chromium_50s.mp4 -frames:v 1 artifacts/frame_35s.png >/dev/null 2>&1
          ffmpeg -y -ss 48 -i artifacts/NutriDesk_Real_Chromium_50s.mp4 -frames:v 1 artifacts/frame_48s.png >/dev/null 2>&1

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriDesk-Real-Chromium-Video
          path: |
            artifacts/NutriDesk_Real_Chromium_50s.mp4
            artifacts/nutridesk_chromium_start.png
            artifacts/nutridesk_chromium_last_frame.png
            artifacts/frame_05s.png
            artifacts/frame_20s.png
            artifacts/frame_35s.png
            artifacts/frame_48s.png
          if-no-files-found: error
          retention-days: 7

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo '=== NutriDesk ==='
          cat /tmp/nutridesk-demo.log || true
          echo '=== websockify ==='
          cat /tmp/websockify.log || true
