name: NutriDesktop Release

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL base onde installer/version.json serão publicados"
        required: false
        default: ""
      channel:
        type: choice
        options: [stable, beta]
        default: stable
      publish:
        description: "Publicar GitHub Release após gerar os artefatos"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "nutridesktop/version.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r license_server/requirements.txt
          python -m pip install httpx2
      - run: choco install innosetup -y
      - name: Build, test and package release
        shell: pwsh
        env:
          KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          $baseUrl = "${{ inputs.base_url || '' }}"
          $channel = "${{ inputs.channel || 'stable' }}"
          if ([string]::IsNullOrWhiteSpace($env:KEY_B64)) {
            Write-Host "UPDATE_SIGNING_PRIVATE_KEY_B64 ausente: publicando instalador + checksums sem version.json."
            python tools/build_release.py --allow-unsigned --base-url "$baseUrl" --channel "$channel"
          } else {
            New-Item -ItemType Directory -Force .release | Out-Null
            [IO.File]::WriteAllBytes('.release/update_private.pem',[Convert]::FromBase64String($env:KEY_B64))
            python tools/build_release.py --private-key .release/update_private.pem --base-url "$baseUrl" --channel "$channel"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: NutriDesktop-${{ inputs.channel || 'stable' }}
          path: release/*
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "from nutridesktop.version import APP_VERSION; print(APP_VERSION)"
          if (gh release view "v$v" 2>$null) {
            gh release upload "v$v" release/* --clobber
          } else {
            gh release create "v$v" release/* --target "${{ github.sha }}" --title "NutriDesktop $v" --notes-file CHANGELOG.md
          }
