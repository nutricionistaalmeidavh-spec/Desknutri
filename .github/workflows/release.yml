name: NutriDesktop Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar GitHub Release após gerar os artefatos"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "nutridesktop/version.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r license_server/requirements.txt
          python -m pip install httpx2
      - run: choco install innosetup -y
      - name: Build, test and package release
        shell: pwsh
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: NutriDesktop-stable
          path: release/*
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "from nutridesktop.version import APP_VERSION; print(APP_VERSION)"
          if (gh release view "v$v" 2>$null) {
            gh release upload "v$v" release/* --clobber
          } else {
            gh release create "v$v" release/* --target "${{ github.sha }}" --title "NutriDesktop $v" --notes-file CHANGELOG.md
          }
