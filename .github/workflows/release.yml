name: NutriDesktop Release
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL base onde installer/version.json serão publicados"
        required: false
        default: ""
      channel:
        type: choice
        options: [stable, beta]
        default: stable
      publish:
        description: "Publicar GitHub Release após gerar os artefatos"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: choco install innosetup -y
      - name: Write signing key
        shell: pwsh
        env:
          KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          New-Item -ItemType Directory -Force .release | Out-Null
          [IO.File]::WriteAllBytes('.release/update_private.pem',[Convert]::FromBase64String($env:KEY_B64))
      - name: Build, test and sign release
        shell: pwsh
        run: python tools/build_release.py --private-key .release/update_private.pem --base-url "${{ inputs.base_url }}" --channel "${{ inputs.channel }}"
      - uses: actions/upload-artifact@v4
        with:
          name: NutriDesktop-${{ inputs.channel }}
          path: release/*
      - name: Publish GitHub Release (explicit opt-in)
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "from nutridesktop.version import APP_VERSION; print(APP_VERSION)"
          gh release create "v$v" release/* --title "NutriDesktop $v" --notes-file CHANGELOG.md
