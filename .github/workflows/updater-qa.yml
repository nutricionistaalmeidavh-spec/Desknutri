name: NutriDesk Updater QA

on:
  push:
    branches: [main, feat/nutridesk-updater-integrado]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  updater-linux:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -r license_server/requirements.txt
      - run: python -m pip install httpx2
      - run: python -m pytest -q tests/test_updater_integrated.py
      - run: python -m pytest -q
      - run: python -m compileall -q app.py nutridesktop

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -r license_server/requirements.txt
      - run: python -m pip install httpx2
      - run: choco install innosetup -y
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: nutridesk-updater-candidate
          path: release/*
